{% extends 'base.html' %}

{% block title %}
Thank You | Faculty Review Portal
{% endblock %}


{% block content %}

<div class="thank-you-page">

    <div class="thank-you-card">

        <div class="success-icon">

            <i class="fa-solid fa-check"></i>

        </div>


        <h1>
            Thank You!
        </h1>


        <p>
            Your feedback has been submitted successfully.
        </p>


        <p class="small-text">

            Your response will help improve the
            learning experience.

        </p>


        <a
            href="{% url 'home' %}"
            class="btn btn-primary-custom"
        >

            Back to Home

        </a>

    </div>
</div>
{% endblock %}
